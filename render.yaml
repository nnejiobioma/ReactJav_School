services:
  - type: web
    name: reactjav-keycloak
    runtime: docker
    dockerfilePath: ./keycloak/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "8080"
      - key: KC_HTTP_PORT
        value: "8080"
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        value: ReactJavAdmin2026!
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HEALTH_ENABLED
        value: "true"
