<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="rjGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Card -->
  <rect width="512" height="512" rx="128" fill="url(#rjGrad)" />
  <!-- Atomic Orbit 1 -->
  <ellipse cx="256" cy="256" rx="190" ry="76" fill="none" stroke="url(#orbitGrad)" stroke-width="22" transform="rotate(-30 256 256)" opacity="0.9" />
  <!-- Atomic Orbit 2 -->
  <ellipse cx="256" cy="256" rx="190" ry="76" fill="none" stroke="url(#orbitGrad)" stroke-width="22" transform="rotate(30 256 256)" opacity="0.9" />
  <!-- Central Nucleus -->
  <circle cx="256" cy="256" r="32" fill="#ffffff" />
  <!-- Graduation Cap / Diamond Sparkle -->
  <path d="M256 120 L330 160 L256 200 L182 160 Z" fill="#ffffff" opacity="0.95" />
</svg>
